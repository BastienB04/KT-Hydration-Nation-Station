ass="eye eye-right"><circle fill="#141414" cx="295" cy="213" r="13"/><circle class="glint" fill="#FFFFFF" cx="290.5" cy="208.5" r="4.5"/></g></g><path class="mouth" fill="none" d="M228,236 Q256,251 284,236"/></g></svg><rect x="20" y="226" width="380" height="368" rx="24" fill="#FFFFFF" stroke="#141414" stroke-width="3.5" /><text x="210" y="278" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="900" fill="#141414" text-anchor="middle" >Your daily goal</text><text x="210" y="304" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#5B635E" text-anchor="middle" >How much should we sip each day?</text><text x="210" y="346" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#141414" text-anchor="middle" >Daily goal (ml)</text><rect x="46" y="358" width="328" height="84" rx="42" fill="#FFF9E5" stroke="#141414" stroke-width="2.5" /><circle cx="88" cy="400" r="26" fill="#A6EC66" stroke="#141414" stroke-width="3.5"/><g transform="translate(74.0 386.0) scale(1.1667)" fill="none" stroke="#141414" stroke-width="2.57" stroke-linecap="round" stroke-linejoin="round"><path d="M6,12 H18"/></g><circle cx="332" cy="400" r="26" fill="#A6EC66" stroke="#141414" stroke-width="3.5"/><g transform="translate(318.0 386.0) scale(1.1667)" fill="none" stroke="#141414" stroke-width="2.57" stroke-linecap="round" stroke-linejoin="round"><path d="M12,6 V18 M6,12 H18"/></g><text x="210" y="412" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="900" fill="#141414" text-anchor="middle" >2000</text><text x="210" y="432" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#5B635E" text-anchor="middle" >ml a day</text><text x="46" y="486.0" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#5B635E" text-anchor="start" >Tips are general, not medical advice. If a clinician</text><text x="46" y="504.0" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#5B635E" text-anchor="start" >has told you to limit fluids, follow their advice and</text><text x="46" y="522.0" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#5B635E" text-anchor="start" >set your goal with them.</text><text x="46" y="556.0" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#1F6F5B" text-anchor="start" >Little and often is the frog way. No need to leap</text><text x="46" y="574.0" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#1F6F5B" text-anchor="start" >all at once.</text><rect x="60" y="618" width="300" height="56" rx="28" fill="#A6EC66" stroke="#141414" stroke-width="3.5" /><text x="210" y="653" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="900" fill="#141414" text-anchor="middle" >Next</text></svg>