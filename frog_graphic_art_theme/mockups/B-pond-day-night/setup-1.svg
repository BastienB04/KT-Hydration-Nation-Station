t x="60" y="542.0" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#5B635E" text-anchor="start" >Tips are general, not medical advice. If a</text><text x="60" y="560.0" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#5B635E" text-anchor="start" >clinician has told you to limit fluids, follow their</text><text x="60" y="578.0" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#5B635E" text-anchor="start" >advice and set your goal with them.</text><rect x="60" y="630" width="300" height="50" rx="25.0" fill="#A6EC66" stroke="#1F6F5B" stroke-width="2.5" /><text x="210.0" y="661.5" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="800" fill="#141414" text-anchor="middle" >Next</text></svg>