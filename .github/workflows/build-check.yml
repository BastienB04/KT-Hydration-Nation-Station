# Builds the Windows installer on every push to main and keeps it as a workflow
# artifact (Actions tab → run → Artifacts). No GitHub Release is created; that is
# release.yml's job. Unsigned workflow artifacts are for compatibility testing.
name: build-check

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci
      - run: npm test -- --run
      - run: npm run test:release
      - run: npm run build
      - run: npm audit --audit-level=low
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path scripts/verify-update/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path scripts/verify-update/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path scripts/verify-update/Cargo.toml

      - name: Build installer (no release)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "windows-x64-installer"
